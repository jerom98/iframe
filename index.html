<script>
    window.addEventListener('message', function (event) {
        console.log('Message received from the parent: ' + event.data); // Message received from parent
        if (isWebView()) {
            alert('Message received from the parent: ' + JSON.stringify(event.data));
        }
    });

    function debounce(func, duration) {
        let timeout;

        return function (...args) {
            const effect = () => {
                timeout = null;
                return func.apply(this, args);
            };

            clearTimeout(timeout);
            timeout = setTimeout(effect, duration);
        };
    }

    function setUrl() {
        const url = window.location.href;
        document.getElementById('url').innerHTML = url;
    }

    function setThemeColor() {
        const searchParams = new URLSearchParams(window.location.search);
        if (searchParams.has('__bwDarkMode') && searchParams.get('__bwDarkMode') == 'true') {
            //dark theme
            document.body.style.backgroundColor = '#03072a';
        } else {
            // light theme
            document.body.style.backgroundColor = '#dedede';
        }
    }

    function hideNonNativeElements() {
        if (!isWebView()) {
            document.querySelectorAll('[data-native-only="true"]').forEach((element) => {
                element.style.display = 'none';
            });
        }
    }

    window.onload = function () {
        setUrl();
        setThemeColor();
        hideNonNativeElements();
    };

    function getDeviceSpecificFunction(nativeFunction, webFunction) {
        if (window.ReactNativeWebView != undefined) {
            nativeFunction();
        } else {
            webFunction();
        }
    }

    function isWebView() {
        return window.ReactNativeWebView != undefined;
    }

    const debouncedGetDeviceSpecificFunction = debounce((...args) => getDeviceSpecificFunction(...args), 500);

    function reloadWidgetsWeb() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: ['REFRESH_WIDGET', { reloadDashboard: true }],
            shouldCloseModal: true,
        };
        window.parent.postMessage(obj, '*');
    }

    function reloadWidgetsNative() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: ['REFRESH_WIDGET', { reloadDashboard: true }],
            shouldCloseModal: true,
        };
        const stringifiedData = JSON.stringify(obj);
        window.ReactNativeWebView.postMessage(stringifiedData);
    }

    function setFiltersWeb() {
        const searchParams = new URLSearchParams(window.location.search);
        const dashboardId = searchParams.get('__dashid');
        const obj = {
            type: 'EVENT_VAN',
            eventParams: [
                'UPDATE_FILTERS',
                {
                    filterUrl:
                        window.location.search.includes('Midwest') && window.location.search.replace('Midwest', 'West'),
                    dashboardId: dashboardId,
                },
            ],
            shouldCloseModal: false,
        };
        window.parent.postMessage(obj, '*');
    }

    function setFiltersNative() {
        const searchParams = new URLSearchParams(window.location.search);
        if (searchParams.has('Region', 'Midwest')) {
            const filterArr = [];
            for (let [key, value] of searchParams.entries()) {
                if (key.startsWith('__')) continue;
                if (key === 'Region') {
                    value = value.replace('Midwest', 'West');
                }
                filterArr.push({ filterName: key, value: value.split(',') });
            }
            const obj = {
                type: 'EVENT_VAN',
                eventParams: [
                    'UPDATE_FILTERS',
                    {
                        filterArr,
                    },
                ],
                shouldCloseModal: false,
            };
            const stringifiedData = JSON.stringify(obj);
            window.ReactNativeWebView.postMessage(stringifiedData);
        }
        reloadWidgetsNative();
    }

    function navigateDashlinkWeb() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: [
                'NAVIGATE_DASHLINK',
                {
                    dashboardId: 19,
                    query: 'Make=Ford&Model=F-150&Region=South&State=FL',
                },
            ],
            shouldCloseModal: true,
        };
        window.parent.postMessage(obj, '*');
    }

    function navigateDashlinkNative() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: [
                'NAVIGATE_DASHLINK',
                {
                    filterParams: [],
                    dashboardId: '19',
                    param: [
                        {
                            key: 'test',
                            value: 'Make=Ford&Model=F-150&Region=South&State=FL',
                            isFilterQuery: true,
                        },
                    ],
                },
            ],
            shouldCloseModal: true,
        };
        const stringifiedData = JSON.stringify(obj);
        window.ReactNativeWebView.postMessage(stringifiedData);
    }

    function breadcrumbBackWeb() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: [
                'BREADCRUMB_BACK',
                {
                    dashboardId: 17,
                },
            ],
            shouldCloseModal: true,
        };
        window.parent.postMessage(obj, '*');
    }

    function breadcrumbBackNative() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: [
                'BREADCRUMB_BACK',
                {
                    dashboardId: 17,
                },
            ],
            shouldCloseModal: true,
        };
        const stringifiedData = JSON.stringify(obj);
        window.ReactNativeWebView.postMessage(stringifiedData);
    }

    function uploadFilesNative() {
        const options = {
            uploadType: 'gallery',
            // maxWidth: 500,
            // maxHeight: 500,
            // selectionLimit: 5,
            // quality: 0.5, // photo only
            // mediaType: 'photo', // photo, video, mixed
            // durationLimit: 3, // video recording max time in seconds
            // videoQuality: 'low', // low, high, medium(IOS only)
            // formatAsMp4: true, //ios only
        };
        // all the available options https://www.npmjs.com/package/react-native-image-picker#options

        const obj = {
            type: 'EVENT_VAN',
            eventParams: ['UPLOAD_FILES', options],
        };
        const stringifiedData = JSON.stringify(obj);
        window.ReactNativeWebView.postMessage(stringifiedData);
    }
    function uploadFilesFromCameraNative() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: ['UPLOAD_FILES', { uploadType: 'camera' }],
        };
        const stringifiedData = JSON.stringify(obj);
        window.ReactNativeWebView.postMessage(stringifiedData);
    }
    function scanBarcodeNative() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: ['SCAN_BARCODE'],
        };
        const stringifiedData = JSON.stringify(obj);
        window.ReactNativeWebView.postMessage(stringifiedData);
    }
    function closeModalNative() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: ['anything'],
            shouldCloseModal: true,
        };
        const stringifiedData = JSON.stringify(obj);
        window.ReactNativeWebView.postMessage(stringifiedData);
    }
    function closeModalWeb() {
        const obj = {
            type: 'EVENT_VAN',
            eventParams: ['anything'],
            shouldCloseModal: true,
        };
        window.parent.postMessage(obj, '*');
    }
</script>

<style>
    body {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-items: center;
        height: 100%;
        overflow: hidden;
        background-color: transparent;
        color: maroon;
        padding: 20px;
    }
    button {
        font-size: 18px;
        color: aliceblue;
        padding: 12px;
        background-color: rgb(72, 72, 255);
        margin-bottom: 6px;
        border-radius: 12px;
        border: none;
    }
    h2 {
        padding: 20px;
    }
</style>

<body>
    <h3>iframe URL: <span id="url"></span></h3>
    <button onclick="debouncedGetDeviceSpecificFunction(closeModalNative,closeModalWeb)" data-native-only="true">
        Close Modal
    </button>
    <button onclick="debouncedGetDeviceSpecificFunction(uploadFilesNative,()=>{})" data-native-only="true">
        Upload Files
    </button>
    <button onclick="debouncedGetDeviceSpecificFunction(uploadFilesFromCameraNative,()=>{})" data-native-only="true">
        Upload Files - Camera
    </button>
    <button onclick="debouncedGetDeviceSpecificFunction(scanBarcodeNative,()=>{})" data-native-only="true">
        Scan Barcode
    </button>
    <button onclick="debouncedGetDeviceSpecificFunction(reloadWidgetsNative,reloadWidgetsWeb)">Reload Widgets</button>
    <button onclick="debouncedGetDeviceSpecificFunction(setFiltersNative,setFiltersWeb)">
        Replace Midwest Region filter with West Region
    </button>
    <button onclick="debouncedGetDeviceSpecificFunction(breadcrumbBackNative,breadcrumbBackWeb)">
        Breadcrumb Back
    </button>
    <button onclick="debouncedGetDeviceSpecificFunction(navigateDashlinkNative,navigateDashlinkWeb)">
        Navigate from Dashlink click
    </button>
    <div data-native-only="true">
        <label for="lname">File input:</label>
        <input type="file" id="fileInput" name="file" />
    </div>
</body>
